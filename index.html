<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 기본 스타일 */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* 네비게이션 바 */
        nav {
            background-color: #333;
            color: white;
            position: relative;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-menu li {
            position: relative;
        }

        .nav-menu a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }

        .nav-menu a:hover {
            background-color: #555;
        }

        /* 서브메뉴 */
        .submenu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100vw;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            padding: 20px 0;
        }

        .submenu-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }

        .submenu-column {
            flex: 1;
            padding: 0 20px;
        }

        .submenu-column h3 {
            margin: 0 0 10px 0;
            color: white;
        }

        .submenu-column ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .submenu-column ul li {
            margin-bottom: 5px;
        }

        .submenu-column ul li a {
            color: #ccc;
            text-decoration: none;
        }

        .submenu-column ul li a:hover {
            color: white;
        }

        /* 호버 시 서브메뉴 표시 */
        nav:hover .submenu {
            display: block;
        }

        /* 햄버거 메뉴 (모바일) */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 3px 0;
            transition: 0.3s;
        }

        /* 모바일 스타일 */
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
                flex-direction: column;
                width: 100%;
                position: absolute;
                top: 100%;
                left: 0;
                background-color: #333;
            }

            .nav-menu.active {
                display: flex;
            }

            .hamburger {
                display: flex;
            }

            .submenu {
                position: static;
                width: 100%;
                background-color: #444;
                display: none;
            }

            .submenu.active {
                display: block;
            }

            .submenu-container {
                flex-direction: column;
            }

            .submenu-column {
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">
                <a href="#">Logo2</a>
            </div>
            <ul class="nav-menu">
                <li><a href="#">메뉴1</a></li>
                <li><a href="#">메뉴2</a></li>
                <li><a href="#">메뉴3</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="submenu">
            <div class="submenu-container">
                <div class="submenu-column">
                    <h3>메뉴1 서브1</h3>
                    <ul>
                        <li><a href="#">항목1</a></li>
                        <li><a href="#">항목2</a></li>
                    </ul>
                </div>
                <div class="submenu-column">
                    <h3>메뉴1 서브2</h3>
                    <ul>
                        <li><a href="#">항목3</a></li>
                        <li><a href="#">항목4</a></li>
                    </ul>
                </div>
                <div class="submenu-column">
                    <h3>메뉴2 서브1</h3>
                    <ul>
                        <li><a href="#">항목5</a></li>
                        <li><a href="#">항목6</a></li>
                    </ul>
                </div>
                <div class="submenu-column">
                    <h3>메뉴3 서브1</h3>
                    <ul>
                        <li><a href="#">항목7</a></li>
                        <li><a href="#">항목8</a></li>
                    </ul>
                </div>
                <div class="submenu-column">
                    <h3>메뉴3 서브2</h3>
                    <ul>
                        <li><a href="#">항목9</a></li>
                        <li><a href="#">항목10</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <h1><a href="jonny.html">jonnyd223456</a></h1>
    <img src="images/screen.png" alt="">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // 햄버거 메뉴 토글
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.querySelector('.nav-menu');
        const submenu = document.querySelector('.submenu');
        const nav = document.querySelector('nav');

        // GSAP 애니메이션 (데스크톱 호버)
        let submenuTl = gsap.timeline({ paused: true });
        submenuTl.fromTo(submenu, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" });

        nav.addEventListener('mouseenter', () => {
            submenu.style.display = 'block';
            submenuTl.play();
        });

        nav.addEventListener('mouseleave', () => {
            submenuTl.reverse().then(() => {
                submenu.style.display = 'none';
            });
        });

        // 모바일 메뉴 클릭 (GSAP 애니메이션 추가)
        hamburger.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            
            if (submenu.classList.contains('active')) {
                // 서브메뉴 닫을 때
                gsap.to(submenu, { opacity: 0, y: -20, duration: 0.3, ease: "power2.in", onComplete: () => {
                    submenu.classList.remove('active');
                }});
            } else {
                // 서브메뉴 열 때
                submenu.classList.add('active');
                gsap.fromTo(submenu, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" });
            }
        });
    </script>
</body>
</html>
